[versions]
agp = "9.4.0"
kotlin = "2.1.0"
coreKtx = "1.15.0"
activityCompose = "1.10.0"
composeBom = "2025.02.00"
material3 = "1.5.0-alpha28"
lifecycle = "2.8.7"


coroutines = "1.9.0"
room = "2.7.1"
ksp = "2.1.0-1.0.29"
junit = "4.13.2"
